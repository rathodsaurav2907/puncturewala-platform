services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4001:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/puncturewala
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npx nodemon src/server.js"
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mongo_data:
